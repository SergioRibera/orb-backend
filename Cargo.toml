[package]
name = "orb_api"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
actix-cors = "0.7.1"
actix-web = "4.13.0"
actix-web-grants = "4.1.2"
actix-web-httpauth = "0.8.2"
bcrypt = "0.19.0"
jsonwebtoken = "10.3.0"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [
    "runtime-async-std",
    "sqlite",
    "postgres",
    "macros",
    "migrate",
] }
time = { version = "0.3.47", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v7", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"
